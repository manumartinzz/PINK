<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pink</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23ff3d9a'/><circle cx='38' cy='36' r='14' fill='%23ffd9eb'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1 class="brand">Pink</h1>
      <p id="status" class="status" role="status">Pronta</p>
      <div class="toggles">
        <button id="btnVoz" class="toggle" type="button" aria-pressed="true">Voz da Pink</button>
        <button id="btnPalmas" class="toggle" type="button" aria-pressed="false">Acordar com 2 palmas<span class="medidor" aria-hidden="true"><i id="medidorBarra"></i></span></button>
        <button id="btnChamar" class="toggle" type="button" aria-pressed="false">Só quando me chamar</button>
        <button id="btnLimpar" class="toggle" type="button">Nova conversa</button>
      </div>
    </header>

    <main class="grid">
      <aside class="panel stats" aria-label="Seu computador">
        <h2>Seu computador</h2>
        <div class="gauge" data-key="cpu"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trilho" cx="50" cy="50" r="42"/><circle class="valor" cx="50" cy="50" r="42"/></svg><b>0%</b><span>Processador</span></div>
        <div class="gauge" data-key="ram"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trilho" cx="50" cy="50" r="42"/><circle class="valor" cx="50" cy="50" r="42"/></svg><b>0%</b><span>Memória</span></div>
        <div class="gauge" data-key="disco"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trilho" cx="50" cy="50" r="42"/><circle class="valor" cx="50" cy="50" r="42"/></svg><b>0%</b><span>Disco</span></div>
        <div class="gauge" data-key="bateria" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trilho" cx="50" cy="50" r="42"/><circle class="valor" cx="50" cy="50" r="42"/></svg><b>0%</b><span>Bateria</span></div>
      </aside>

      <section class="stage" aria-label="Conversa por voz">
        <canvas id="orb" aria-hidden="true"></canvas>
        <p id="legenda" class="legenda">Toque no microfone ou escreva abaixo.</p>
        <div class="chips" id="chips">
          <button type="button" class="chip">Que horas são?</button>
          <button type="button" class="chip">Como está meu computador?</button>
          <button type="button" class="chip">Abrir YouTube</button>
          <button type="button" class="chip">Pesquisar receita de bolo</button>
        </div>
        <form id="composer" class="composer" autocomplete="off">
          <button id="btnMic" class="mic" type="button" aria-label="Falar com a Pink" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <input id="texto" type="text" placeholder="Escreva para a Pink" aria-label="Mensagem para a Pink" maxlength="500">
          <button class="enviar" type="submit">Enviar</button>
        </form>
      </section>

      <section class="panel log" aria-label="Histórico da conversa">
        <h2>Conversa</h2>
        <div id="log" class="msgs" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <script src="palmas.js"></script>
  <script src="app.js"></script>
</body>
</html>
